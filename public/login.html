<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="/css/court.css"><title>Family Court · Passcode</title></head>
<body>
<header class="bar"><span class="seal">⚖️</span><h1 data-court-name>Family Court</h1></header>
<main>
  <h2>Order in the court!</h2>
  <p class="muted">Enter the passcode to come in.</p>
  <form id="login" class="card" autocomplete="off">
    <label for="passcode">Passcode</label>
    <input id="passcode" name="passcode" type="password" inputmode="text" autocomplete="current-password" required autofocus>
    <p class="error" id="err" role="alert"></p>
    <button class="btn" type="submit">Enter the courtroom</button>
  </form>
</main>
<footer>Voice by ElevenLabs · Decisions by TypeSafe Jev · Running on Fly.io Sprites</footer>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body></html>
